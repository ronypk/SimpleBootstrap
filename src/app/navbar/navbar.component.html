<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container text-uppercase p-2">
    <a class="navbar-brand" href="#">{{ brand }}</a>
    <button class="navbar-toggler" type="button" aria-label="Toggle navigation"
            [attr.aria-expanded]="!collapsed" (click)="collapsed = !collapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse" [ngClass]="{ collapse: collapsed }">
      <ul class="navbar-nav ml-auto text-uppercase">
        <li class="nav-item" *ngFor="let link of links" [class.active]="link.target === activeTarget">
          <a class="nav-link" [href]="'#' + link.target" (click)="activeTarget = link.target; collapsed = true">
            {{ link.label }}
            <span class="sr-only" *ngIf="link.target === activeTarget">(current)</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
